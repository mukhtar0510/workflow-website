<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IDEV CORE // Workflow Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #02040A;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 163, 255, 0.14) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.09) 0, transparent 50%);
        }
        .glass-panel {
            background: rgba(8, 12, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 163, 255, 0.12);
            box-shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.8);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover, .glass-panel:focus-within {
            border-color: rgba(0, 163, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 163, 255, 0.1);
        }
        .task-card {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid #00A3FF;
            transition: all 0.2s ease;
        }
        .task-card:hover {
            background: rgba(12, 20, 38, 0.7);
            transform: translateY(-1px);
        }
        .task-completed {
            border-left-color: #10B981 !important;
            opacity: 0.6;
        }
        .timer-active { border-left-color: #10B981; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 50% { border-left-color: rgba(16, 185, 129, 0.3); } }
        
        input, textarea, select {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #00A3FF !important;
            outline: none !important;
            box-shadow: 0 0 0 2px rgba(0, 163, 255, 0.15) !important;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #02040A; }
        ::-webkit-scrollbar-thumb { background: #1A2333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00A3FF; }
    </style>
</head>
<body class="text-gray-300 min-h-screen pb-6">

    <header class="max-w-7xl mx-auto px-4 pt-4 pb-2 flex justify-between items-center border-b border-gray-900 mb-4">
        <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/10 tracking-tighter">
                II
            </div>
            <div>
                <h1 class="text-xs font-mono text-gray-500 uppercase tracking-widest">IDEV INC // CLOUD TERMINAL</h1>
                <h2 class="text-sm font-bold text-white tracking-tight">Welcom Back, Mukhtar</h2>
            </div>
        </div>
        
        <div id="authContainer" class="flex items-center gap-2 text-[10px] font-mono glass-panel px-3 py-1.5 rounded-xl border-dashed">
            <div class="flex gap-1.5 items-center">
                <i data-lucide="cloud-off" class="w-3.5 h-3.5 text-amber-500" id="syncStatusIcon"></i>
                <input type="email" id="authEmail" placeholder="Email" class="px-2 py-0.5 rounded text-[10px] w-28 bg-black">

            </div>
        </div>

    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <div class="glass-panel rounded-xl p-3.5 space-y-3.5 flex flex-col justify-between h-[540px]">
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <h2 class="text-xs font-semibold flex items-center gap-1.5 text-blue-400"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> Chrono Matrix</h2>
                    <div class="flex items-center gap-1">
                        <button onclick="prevMonth()" class="p-0.5 hover:bg-gray-900 rounded text-gray-400"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>

                <div id="calendarGrid" class="grid grid-cols-7 gap-0.5 text-[9px] font-mono text-center mb-1.5 bg-black/30 p-1 rounded-lg border border-gray-900"></div>

            <div class="border-t border-gray-900 pt-2.5">

                    <button onclick="quickAddReminder()" class="text-[9px] bg-purple-500/10 border border-purple-500/20 text-purple-400 px-1.5 py-0.5 rounded hover:bg-purple-500/20 transition">+ Queue</button>
                </div>
                <div id="reminderList" class="space-y-1 max-h-[90px] overflow-y-auto pr-0.5"></div>

            <div class="border-t border-gray-900 pt-2.5">

                    <div class="flex gap-1">
                        <input type="text" id="newTimerNameInput" placeholder="Node title" class="text-[9px] rounded-md px-1.5 py-0.5 w-20 font-mono">
                        <button onclick="createMergedTimer()" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-1.5 rounded text-[10px] font-bold hover:bg-emerald-500/20">+</button>

        <div class="glass-panel rounded-xl p-3.5 flex flex-col justify-between h-[540px]">
            <div class="flex flex-col h-[420px]">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xs font-semibold flex items-center gap-1.5 text-sky-400"><i data-lucide="check-square" class="w-3.5 h-3.5"></i> Workflow Controls</h2>
                    <span id="taskStatsBadge" class="text-[9px] font-mono bg-gray-950 px-2 py-0.5 rounded border border-gray-900 text-gray-400"></span>
                </div>
                <div id="kanbanContainer" class="space-y-3 overflow-y-auto flex-1 pr-0.5"></div>

            <div class="border-t border-gray-900 pt-2.5 space-y-1">

                    <input type="text" id="quickTaskTitle" placeholder="Initialize objective..." class="text-[10px] rounded-md px-2 py-1 flex-1">
                    <select id="quickTaskStage" class="text-[10px] rounded-md px-1 text-gray-300 w-24">
                        <option value="backlog" id="opt-col1">📋 Backlog</option>

                <div class="flex gap-1">

                </div>

        <div class="glass-panel rounded-xl p-3.5 space-y-3 flex flex-col justify-between h-[540px]">
            <div>
                <h2 class="text-xs font-semibold flex items-center gap-1.5 text-amber-400 mb-1.5"><i data-lucide="sticky-note" class="w-3.5 h-3.5"></i> Persistent Scratchpad</h2>
                <textarea id="globalNotes" rows="3" oninput="debouncedSync()" class="w-full rounded-lg text-[10px] font-mono p-1.5 resize-none placeholder:text-gray-700" placeholder="// Drop immediate code architecture snapshots..."></textarea>
            </div>
            <div class="border-t border-gray-900 pt-2">
                <h2 class="text-xs font-semibold flex items-center gap-1.5 text-cyan-400 mb-1"><i data-lucide="cpu" class="w-3.5 h-3.5"></i> Hardware Clusters</h2>
                <div id="hardwareList" class="space-y-1 max-h-[120px] overflow-y-auto pr-0.5"></div>
            </div>
            <div class="border-t border-gray-900 pt-2">
                <h2 class="text-xs font-semibold flex items-center gap-1.5 text-fuchsia-400 mb-1"><i data-lucide="git-branch" class="w-3.5 h-3.5"></i> Dynamic Structural Matrix</h2>
                <div id="matrixLinksList" class="space-y-1.5 max-h-[160px] overflow-y-auto pr-0.5"></div>
            </div>
        </div>
    </main>

    <div id="txtModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel rounded-xl w-full max-w-lg p-4 space-y-3 border border-blue-500/30 flex flex-col h-[400px]">
            <div class="flex justify-between items-center border-b border-gray-900 pb-2">
                <div class="flex items-center gap-2 text-blue-400">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span id="modalFileName" class="text-xs font-mono font-bold text-gray-200">file_sandbox.txt</span>
                </div>
                <button onclick="closeTxtModal()" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <textarea id="modalTextContent" readonly class="w-full flex-1 bg-black/40 border border-gray-900 rounded-lg p-2.5 font-mono text-[11px] text-gray-300 resize-none focus:outline-none"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeTxtModal()" class="bg-gray-900 border border-gray-800 text-gray-400 px-3 py-1 rounded-md text-xs hover:text-white transition">Close Browser Viewer</button>
            </div>
        </div>
    </div>

    <footer class="max-w-7xl mx-auto px-4 mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 text-[10px] font-mono">
        <div class="glass-panel rounded-lg p-2.5 flex justify-between items-center">
            <div id="liveSummary" class="flex gap-4 text-gray-500"></div>
            <button onclick="copyWorkflowSnapshot()" class="bg-gray-950 border border-gray-800 hover:text-white px-2 py-0.5 rounded transition">Snap</button>
        </div>
        <div class="glass-panel rounded-lg p-2.5 flex items-center justify-between">
            <span class="text-gray-600">CLOUD SYNC LAYER ACTIVE // SUPABASE CLOUD</span>
            <div class="flex gap-2">
                <button onclick="resetAllWorkspace()" class="text-red-400 hover:text-red-300">Purge</button>
                <button onclick="exportAllData()" class="text-blue-400 hover:text-blue-300">Backup</button>
            </div>
        </div>
    </footer>

    <script>
        // --- SECURE PROVISIONED CREDENTIALS MAPPED ---
        const SUPABASE_URL = "https://spnxmkzudlkhsboivfax.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwbnhta3p1ZGxraHNib2l2ZmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcyNzEsImV4cCI6MjA5NTQwMzI3MX0.pCND95Fg6rWTXYVW90IYKEeEpQkXuO77kMnA5Nbec74";
        
        let supabaseClient = null;
        let authenticatedUser = null;
        let syncTimeout = null;

        // Base Arrays Mapped
        let tasks = { backlog: [], inprogress: [], done: [] };
        let columnNames = { backlog: "📋  backlog:", inprogress: "⚙️ inprogress:", done: "✅ done" };
        let reminders = []; let timers = []; let events = [];
        
        let hardware = [
            { id: 1, type: "Core Terminal", name: "ASUS Vivobook 16X", note: "Ryzen 7 // RTX Architecture Node" },
            { id: 2, type: "Mobile Interface", name: "Samsung Galaxy A17", note: "CODM High Sensitivity Workspace Mapping" },
            { id: 3, type: "Visual Pipeline", name: "LG 32\" Display", note: "Vertical Orientation Mount Array" }
        ];
        let matrix = [
            { id: 1, title: "TAI Group Hub", sub: "Ahmad / Taoheed alignment matrix", url: "#" },
            { id: 2, title: "Multi-Tenancy Core", sub: "Centralized application services", url: "#" },
            { id: 3, title: "Web3 Sandbox", sub: "Solidity architecture nodes", url: "#" },
            { id: 4, title: "Gaming Logs", sub: "EA FC 26 / Naruto Storm 5", url: "#" }
        ];

        let currentCalendarDate = new Date(2026, 4, 26);
        let selectedEventDate = "2026-05-26";

        // Initialize Cloud Engine Client securely
        if(SUPABASE_URL.indexOf("YOUR_") === -1) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        async function initAuthObserver() {
            if(!supabaseClient) return;
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    authenticatedUser = session.user;
                    updateCloudUI(true, authenticatedUser.email);
                    await pullCloudWorkspace();
                } else {
                    authenticatedUser = null;
                    updateCloudUI(false, null);
                }
            });
        }

        function updateCloudUI(isOnline, email) {
            const container = document.getElementById('authContainer');
            if(isOnline) {
                container.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i data-lucide="cloud" class="w-3.5 h-3.5 text-emerald-400 animate-pulse"></i>
                        <span class="text-gray-400 truncate max-w-[110px]">${email}</span>
                        <button onclick="handleCloudSignOut()" class="text-red-400 border border-red-900/40 bg-red-950/20 px-1.5 py-0.5 rounded hover:bg-red-900 hover:text-white transition">Disconnect</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex gap-1.5 items-center">
                        <i data-lucide="cloud-off" class="w-3.5 h-3.5 text-amber-500"></i>
                        <input type="email" id="authEmail" placeholder="Email" class="px-2 py-0.5 rounded text-[10px] w-28 bg-black">
                        <input type="password" id="authPassword" placeholder="Secret Key" class="px-2 py-0.5 rounded text-[10px] w-24 bg-black">
                        <button onclick="handleCloudSignIn()" class="bg-blue-600/30 text-blue-300 border border-blue-500/40 px-2 py-0.5 rounded hover:bg-blue-600 hover:text-white">Connect</button>
                        <button onclick="handleCloudSignUp()" class="text-gray-500 hover:text-gray-300 text-[9px]">Provision</button>
                    </div>
                `;
            }
            if (window.lucide) lucide.createIcons();
        }

        async function handleCloudSignUp() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if(!email || !password) return alert("Provide credentials.");
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if(error) alert("Provision Error: " + error.message);
            else alert("Architecture space provisioned! Click Connect to authenticate.");
        }

        async function handleCloudSignIn() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if(!email || !password) return alert("Provide credentials.");
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if(error) alert("Connection Refused: " + error.message);
        }

        async function handleCloudSignOut() {
            await supabaseClient.auth.signOut();
            localStorage.clear();
            location.reload();
        }

        async function pushCloudWorkspace() {
            if(!supabaseClient || !authenticatedUser) return;
            const notesVal = document.getElementById('globalNotes') ? document.getElementById('globalNotes').value : '';
            const { error } = await supabaseClient
                .from('user_workspaces')
                .update({ 
                    tasks: tasks, 
                    reminders: reminders, 
                    events: events, 
                    notes: notesVal,
                    updated_at: new Date().toISOString()
                })
                .eq('id', authenticatedUser.id);
            if(error) console.error("Database cloud write error:", error);
        }

        async function pullCloudWorkspace() {
            if(!supabaseClient || !authenticatedUser) return;
            const { data, error } = await supabaseClient
                .from('user_workspaces')
                .select('tasks, reminders, events, notes')
                .eq('id', authenticatedUser.id)
                .single();
            
            if(data) {
                if(data.tasks) tasks = data.tasks;
                if(data.reminders) reminders = data.reminders;
                if(data.events) events = data.events;
                if(data.notes && document.getElementById('globalNotes')) document.getElementById('globalNotes').value = data.notes;
                fullRender(false);
            }
        }

        function loadAllLocalCacheFallback() {
            try {
                if(localStorage.getItem('m_tasks_v3')) tasks = JSON.parse(localStorage.getItem('m_tasks_v3'));
                if(localStorage.getItem('m_columns_v3')) columnNames = JSON.parse(localStorage.getItem('m_columns_v3'));
                if(localStorage.getItem('m_reminders_v3')) reminders = JSON.parse(localStorage.getItem('m_reminders_v3'));
                if(localStorage.getItem('m_events_v3')) events = JSON.parse(localStorage.getItem('m_events_v3'));
                if(localStorage.getItem('m_hardware_v3')) hardware = JSON.parse(localStorage.getItem('m_hardware_v3'));
                if(localStorage.getItem('m_matrix_v3')) matrix = JSON.parse(localStorage.getItem('m_matrix_v3'));
                if(localStorage.getItem('m_notes_v3') && document.getElementById('globalNotes')) document.getElementById('globalNotes').value = localStorage.getItem('m_notes_v3');
                
                const storedTimers = localStorage.getItem('m_timers_v3');
                if(storedTimers) {
                    timers = JSON.parse(storedTimers).map(t => ({ id: t.id, name: t.name, seconds: t.seconds, isRunning: false, intervalId: null }));
                }
            } catch(e) { console.error("Cache read fail", e); }
        }

        function saveLocalCache() {
            localStorage.setItem('m_tasks_v3', JSON.stringify(tasks));
            localStorage.setItem('m_columns_v3', JSON.stringify(columnNames));
            localStorage.setItem('m_reminders_v3', JSON.stringify(reminders));
            localStorage.setItem('m_events_v3', JSON.stringify(events));
            localStorage.setItem('m_hardware_v3', JSON.stringify(hardware));
            localStorage.setItem('m_matrix_v3', JSON.stringify(matrix));
            const notesEl = document.getElementById('globalNotes');
            if(notesEl) localStorage.setItem('m_notes_v3', notesEl.value);
            localStorage.setItem('m_timers_v3', JSON.stringify(timers.map(t => ({ id: t.id, name: t.name, seconds: t.seconds }))));
        }

        function debouncedSync() {
            saveLocalCache();
            if(!authenticatedUser) return;
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                pushCloudWorkspace();
            }, 1500); // 1.5s delay to save network resources
        }

        function fullRender(shouldSyncCloud = true) {
            renderCalendar(); renderReminders(); renderTimers();
            renderKanban(); renderHardware(); renderMatrix();
            renderLiveSummary(); updateTaskStats();
            saveLocalCache();
            if(shouldSyncCloud && authenticatedUser) pushCloudWorkspace();
            if (window.lucide) lucide.createIcons();
        }

        // --- KANBAN CONTROLS ---
        function renderKanban() {
            const container = document.getElementById('kanbanContainer');
            if(!container) return; container.innerHTML = '';
            const stages = ['backlog', 'inprogress', 'done'];
            
            stages.forEach(s => {
                const optEl = document.getElementById(`opt-${s}`);
                if(optEl) optEl.innerText = columnNames[s];
            });

            stages.forEach(key => {
                const stageDiv = document.createElement('div');
                stageDiv.className = 'space-y-1 bg-black/10 p-2 rounded-lg border border-gray-900';
                stageDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <input type="text" value="${escapeHtml(columnNames[key])}" onchange="updateColumnName('${key}', this.value)" class="text-[10px] font-mono text-gray-400 font-bold bg-transparent border-none p-0 focus:ring-0 w-3/4">
                        <span class="text-[9px] font-mono font-medium text-gray-600 bg-gray-950 px-1.5 rounded">${tasks[key] ? tasks[key].length : 0}</span>
                    </div>
                `;
                const listDiv = document.createElement('div');
                listDiv.className = 'space-y-1';
                
                if(tasks[key]) {
                    tasks[key].forEach((task, idx) => {
                        const isCompleted = !!task.completed;
                        const taskEl = document.createElement('div');
                        taskEl.className = `task-card p-2 rounded-md text-[11px] bg-black/50 border-l-2 ${isCompleted ? 'task-completed' : (key === 'backlog' ? 'border-l-blue-500' : key === 'inprogress' ? 'border-l-purple-500' : 'border-l-emerald-500')}`;
                        
                        let readButtonHtml = '';
                        if(task.fileContent) {
                            readButtonHtml = `<button onclick="triggerModalView('${key}', ${idx})" class="text-sky-400 hover:text-sky-300 text-[9px] font-mono flex items-center gap-0.5"><i data-lucide="eye" class="w-2.5 h-2.5"></i> Read File</button>`;
                        }

                        taskEl.innerHTML = `
                            <div class="space-y-0.5">
                                <div class="flex justify-between items-start gap-1">
                                    <div class="flex items-center gap-2 max-w-[75%]">
                                        <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTaskProgress('${key}', ${idx}, this.checked)" class="w-3 h-3 rounded border-gray-800 text-blue-500 focus:ring-0 bg-black cursor-pointer">
                                        <span class="font-semibold text-gray-200 truncate ${isCompleted ? 'line-through text-gray-500' : ''}">${escapeHtml(task.title)}</span>
                                    </div>
                                    <span class="text-[9px] font-mono text-blue-400">${task.time || '12:00'}</span>
                                </div>
                                <p class="text-[10px] text-gray-500 truncate pl-5">${escapeHtml(task.meta || 'No document arrays logged')}</p>
                            </div>
                            <div class="flex items-center mt-1.5 pt-1 border-t border-gray-900/60 justify-between pl-5">
                                <div class="flex gap-2 items-center">
                                    <label class="text-[9px] font-mono text-gray-500 hover:text-blue-400 cursor-pointer flex items-center gap-0.5">
                                        <i data-lucide="file-up" class="w-2.5 h-2.5"></i> Ingest
                                        <input type="file" accept=".txt" class="hidden" onchange="parseTxtToTask('${key}', ${idx}, this)">
                                    </label>
                                    ${readButtonHtml}
                                </div>
                                <div class="flex gap-1.5 items-center">
                                    ${key !== 'backlog' ? `<button onclick="moveTask('${key}', ${idx}, 'left')" class="text-gray-500 hover:text-white"><i data-lucide="arrow-left" class="w-2.5 h-2.5"></i></button>` : ''}
                                    ${key !== 'done' ? `<button onclick="moveTask('${key}', ${idx}, 'right')" class="text-gray-500 hover:text-white"><i data-lucide="arrow-right" class="w-2.5 h-2.5"></i></button>` : ''}
                                    <button onclick="deleteTaskItem('${key}', ${idx})" class="text-gray-500 hover:text-red-400"><i data-lucide="trash-2" class="w-2.5 h-2.5"></i></button>
                                </div>
                            </div>
                        `;
                        listDiv.appendChild(taskEl);
                    });
                }
                stageDiv.appendChild(listDiv); container.appendChild(stageDiv);
            });
        }

        function toggleTaskProgress(stage, idx, checked) {
            if(tasks[stage] && tasks[stage][idx]) {
                tasks[stage][idx].completed = checked;
                if(checked && stage !== 'done') {
                    const taskVal = tasks[stage].splice(idx, 1)[0]; tasks['done'].push(taskVal);
                } else if(!checked && stage === 'done') {
                    const taskVal = tasks[stage].splice(idx, 1)[0]; tasks['inprogress'].push(taskVal);
                }
                fullRender();
            }
        }

        function updateColumnName(key, value) { columnNames[key] = value; saveLocalCache(); }
        function parseTxtToTask(stage, idx, input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tasks[stage][idx].meta = `Loaded: ${file.name}`;
                tasks[stage][idx].fileContent = e.target.result;
                fullRender();
            };
            reader.readAsText(file);
        }
        function triggerModalView(stage, idx) {
            const task = tasks[stage][idx]; if(task && task.fileContent) openTxtModal(`${task.title}.txt`, task.fileContent);
        }
        function openTxtModal(fileName, content) {
            document.getElementById('modalFileName').innerText = fileName;
            document.getElementById('modalTextContent').value = content;
            document.getElementById('txtModal').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }
        function closeTxtModal() { document.getElementById('txtModal').classList.add('hidden'); }
        function moveTask(stage, idx, dir) {
            const order = ['backlog', 'inprogress', 'done'];
            const currentIdx = order.indexOf(stage);
            let targetIdx = dir === 'left' ? currentIdx - 1 : currentIdx + 1;
            if(targetIdx < 0 || targetIdx >= order.length) return;
            const taskVal = tasks[stage][idx]; tasks[stage].splice(idx, 1); tasks[order[targetIdx]].push(taskVal);
            fullRender();
        }
        function deleteTaskItem(stage, idx) { tasks[stage].splice(idx, 1); fullRender(); }
        function addMergedTask() {
            const title = document.getElementById('quickTaskTitle').value.trim();
            const stage = document.getElementById('quickTaskStage').value;
            const time = document.getElementById('quickTaskTime').value;
            const meta = document.getElementById('quickTaskMeta').value.trim();
            if(title) { 
                tasks[stage].push({ title, time: time || "12:00", meta, fileContent: "", completed: (stage === 'done') }); 
                document.getElementById('quickTaskTitle').value = ''; document.getElementById('quickTaskMeta').value = '';
                fullRender(); 
            }
        }
        function updateTaskStats() {
            let total = 0; let checkedCompleted = 0;
            ['backlog', 'inprogress', 'done'].forEach(key => {
                if(tasks[key]) { total += tasks[key].length; tasks[key].forEach(t => { if(t.completed) checkedCompleted++; }); }
            });
            const badge = document.getElementById('taskStatsBadge'); if(badge) badge.innerText = `${checkedCompleted}/${total} Completed`;
        }

        // --- SYSTEM REMINDERS MATRIX ---
        function renderReminders() {
            const container = document.getElementById('reminderList'); if(!container) return;
            if(reminders.length === 0) { container.innerHTML = '<div class="text-[9px] text-gray-600 text-center py-2 font-mono">// No logged exceptions found</div>'; return; }
            container.innerHTML = ''; reminders.sort((a,b)=> new Date(a.datetime) - new Date(b.datetime));
            reminders.forEach((rem, idx) => {
                const dateObj = new Date(rem.datetime);
                const div = document.createElement('div'); div.className = 'flex justify-between items-center text-[10px] bg-black/40 p-1 rounded-md border border-gray-900';
                div.innerHTML = `<div><span class="font-medium text-gray-300 block truncate w-40">${escapeHtml(rem.text)}</span><span class="text-[9px] font-mono text-purple-400">${dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
                                <button onclick="deleteReminder(${idx})" class="text-gray-600 hover:text-red-400"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                container.appendChild(div);
            });
        }
        function quickAddReminder() {
            let text = prompt("Enter explicit alert context blueprint:", "Structural Alignment Check"); if(!text) return;
            let dateStr = prompt("Provide Timestamp coordinates (YYYY-MM-DD HH:MM)", "2026-05-26 14:00");
            if(dateStr) { 
                let iso = dateStr.replace(" ", "T"); 
                if(!isNaN(Date.parse(iso))) { reminders.push({ id: Date.now(), text: text, datetime: iso }); fullRender(); } 
                else alert("Format parse mismatch constraints."); 
            }
        }
        function deleteReminder(idx) { reminders.splice(idx,1); fullRender(); }

         // --- ISOLATED REFACTORED FOCUS TIMERS ---
        function renderTimers() {
            const container = document.getElementById('timersListMerged');
            if(!container) return;
            if(timers.length === 0) { container.innerHTML = '<div class="text-[9px] text-gray-600 text-center py-2 font-mono">// Active session clusters idle</div>'; return; }
            container.innerHTML = '';
            timers.forEach(timer => {
                const mins = Math.floor(timer.seconds / 60);
                const secs = timer.seconds % 60;
                const timeStr = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                const div = document.createElement('div');
                div.className = `flex justify-between items-center text-[10px] bg-black/50 p-1.5 rounded-md border border-gray-900 ${timer.isRunning ? 'timer-active' : ''}`;
                div.innerHTML = `
                    <div><span class="font-mono text-gray-400">${escapeHtml(timer.name)}</span> <span class="text-emerald-400 font-mono ml-1 font-bold">${timeStr}</span></div>
                    <div class="flex gap-1.5 items-center">
                        ${!timer.isRunning ? `
                            <button onclick="startTimerById(${timer.id})" class="text-emerald-500 hover:text-emerald-400"><i data-lucide="play" class="w-3 h-3"></i></button>
                        ` : `
                            <button onclick="stopTimerById(${timer.id})" class="text-amber-500 hover:text-amber-400"><i data-lucide="pause" class="w-3 h-3"></i></button>
                        `}
                        <button onclick="resetTimerById(${timer.id})" class="text-gray-500 hover:text-white"><i data-lucide="square" class="w-3 h-3"></i></button>
                        <button onclick="deleteTimerById(${timer.id})" class="text-red-500"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        function createMergedTimer() {
            let name = document.getElementById('newTimerNameInput').value.trim(); if(!name) name = "Dev Session";
            timers.push({ id: Date.now(), name: name, seconds: 0, isRunning: false, intervalId: null });
            document.getElementById('newTimerNameInput').value = ''; renderTimers();
        }
        function startTimerById(id) {
            const timer = timers.find(t => t.id === id); if(!timer || timer.isRunning) return;
            timer.isRunning = true; timer.intervalId = setInterval(() => { timer.seconds++; renderTimers(); }, 1000); renderTimers();
        }
        function stopTimerById(id) {
            const timer = timers.find(t => t.id === id); if(timer && timer.isRunning) { clearInterval(timer.intervalId); timer.isRunning = false; timer.intervalId = null; renderTimers(); }
        }
        function resetTimerById(id) { const timer = timers.find(t => t.id === id); if(timer) { timer.seconds = 0; stopTimerById(id); renderTimers(); } }
        function deleteTimerById(id) { stopTimerById(id); timers = timers.filter(t => t.id !== id); renderTimers(); }

        // --- CALENDAR GRID MATRIX ---
        function renderCalendar() {
            const year = currentCalendarDate.getFullYear(); const month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month+1, 0).getDate();
            const adjustedFirst = firstDay === 0 ? 6 : firstDay-1;
            const container = document.getElementById('calendarGrid'); if(!container) return;
            const monthsLabels = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            document.getElementById('monthYearDisplay').innerText = `${monthsLabels[month]} ${year}`;
            
            let gridHtml = '<div class="text-gray-600 font-bold">M</div><div class="text-gray-600 font-bold">T</div><div class="text-gray-600 font-bold">W</div><div class="text-gray-600 font-bold">T</div><div class="text-gray-600 font-bold">F</div><div class="text-gray-600 font-bold">S</div><div class="text-gray-600 font-bold">S</div>';
            for(let i=0;i<adjustedFirst;i++) gridHtml += `<div class="p-0.5 text-gray-800 opacity-20">-</div>`;
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const hasEvent = events.some(e => e.date === dateStr); const isBaselineToday = (d === 26 && month === 4 && year === 2026);
                let cls = "p-0.5 rounded text-[9px] hover:bg-blue-500/20 cursor-pointer transition";
                if(hasEvent) cls += " bg-blue-950 text-blue-400 font-bold border border-blue-900/50";
                if(isBaselineToday) cls += " ring-1 ring-purple-500 text-white font-extrabold";
                gridHtml += `<div class="${cls}" onclick="selectEventDate('${dateStr}')">${d}</div>`;
            }
            container.innerHTML = gridHtml;
            const eventsContainer = document.getElementById('eventsList'); if(!eventsContainer) return;
            const monthEvents = events.filter(e => new Date(e.date).getMonth() === month && new Date(e.date).getFullYear() === year);
            if(monthEvents.length === 0) eventsContainer.innerHTML = '<div class="text-[9px] text-gray-600 text-center font-mono py-1">// No anomalies cataloged</div>';
            else eventsContainer.innerHTML = monthEvents.map(ev => `<div class="flex justify-between items-center bg-black/40 px-1.5 py-0.5 rounded border border-gray-900"><span class="text-[10px] text-gray-300 truncate w-44">${ev.title} <b class="text-blue-500 font-mono text-[8px]">(${ev.date.substring(5)})</b></span><button onclick="deleteEventById(${ev.id})" class="text-gray-600 hover:text-red-400"><i data-lucide="x" class="w-2.5 h-2.5"></i></button></div>`).join('');
        }
        function selectEventDate(date) { selectedEventDate = date; document.getElementById('newEventTitle').placeholder = `Log to: ${date}`; }
        function addMergedEvent() {
            const title = document.getElementById('newEventTitle').value.trim();
            if(title && selectedEventDate) { events.push({ id: Date.now(), date: selectedEventDate, title: title }); fullRender(); }
        }
        function deleteEventById(id) { events = events.filter(e => e.id !== id); fullRender(); }
        function prevMonth() { currentCalendarDate.setMonth(currentCalendarDate.getMonth()-1); fullRender(); }
        function nextMonth() { currentCalendarDate.setMonth(currentCalendarDate.getMonth()+1); fullRender(); }

        // --- HARDWARE NODES ---
        function renderHardware() {
            const container = document.getElementById('hardwareList'); if(!container) return;
            container.innerHTML = hardware.map((h, index) => `
                <div class="bg-black/50 p-1.5 rounded-md border border-gray-900 text-[11px] space-y-0.5">
                    <div class="text-[8px] font-mono text-cyan-400 uppercase tracking-wider">${escapeHtml(h.type)}</div>
                    <input type="text" value="${escapeHtml(h.name)}" onchange="updateHardwareName(${h.id}, this.value)" class="w-full bg-transparent border-none text-[11px] font-semibold text-gray-200 p-0 focus:ring-0">
                    <div class="text-[9px] font-mono text-gray-500">${escapeHtml(h.note)}</div>
                </div>
            `).join('');
        }
        function updateHardwareName(id, value) { const device = hardware.find(h => h.id === id); if(device) { device.name = value; debouncedSync(); } }

        // --- MATRIX ROUTES ---
        function renderMatrix() {
            const container = document.getElementById('matrixLinksList'); if(!container) return; container.innerHTML = '';
            matrix.forEach((m, idx) => {
                const wrapper = document.createElement('div'); wrapper.className = 'bg-black/50 p-2 rounded-lg border border-gray-900 space-y-1 text-[11px]';
                wrapper.innerHTML = `
                    <input type="text" value="${escapeHtml(m.title)}" onchange="updateMatrixNode(${m.id}, 'title', this.value)" class="font-bold text-fuchsia-400 bg-transparent border-none p-0 focus:ring-0 text-[11px] w-full">
                    <input type="text" value="${escapeHtml(m.sub)}" onchange="updateMatrixNode(${m.id}, 'sub', this.value)" class="text-gray-500 text-[9px] font-mono bg-transparent border-none p-0 focus:ring-0 w-full">
                    <div class="flex items-center gap-1 text-[9px] text-blue-400 bg-black/40 px-1 py-0.5 rounded border border-gray-900/60 mt-1">
                        <i data-lucide="link" class="w-2.5 h-2.5"></i>
                        <input type="text" value="${escapeHtml(m.url)}" onchange="updateMatrixNode(${m.id}, 'url', this.value)" class="bg-transparent border-none p-0 focus:ring-0 text-[9px] font-mono text-blue-500 w-full">
                    </div>`;
                container.appendChild(wrapper);
            });
        }
        function updateMatrixNode(id, field, value) { const node = matrix.find(m => m.id === id); if(node) { node[field] = value; debouncedSync(); } }

        function renderLiveSummary() {
            let total = 0; ['backlog', 'inprogress', 'done'].forEach(k => { if(tasks[k]) total += tasks[k].length; });
            const summary = document.getElementById('liveSummary');
            if(summary) summary.innerHTML = `<div>COLUMNS TOTAL: ${total}</div><div>· SYSTEM ALERTS: ${reminders.length}</div><div>· EXCEPTIONS RECORDED: ${events.length}</div>`;
        }

        function copyWorkflowSnapshot() {
            let total = 0; ['backlog', 'inprogress', 'done'].forEach(k => { if(tasks[k]) total += tasks[k].length; });
            const snapshotStr = `IDEV WORKSPACE\nTasks Active: ${total}\nAlert Matrix: ${reminders.length}\nChrono Clusters: ${events.length}`;
            navigator.clipboard.writeText(snapshotStr); alert("System snapshot mapped to clip layout.");
        }

        function resetAllWorkspace() {
            if(confirm("Purge local layout caches?")) {
                tasks = { backlog: [], inprogress: [], done: [] }; reminders = [];
                timers.forEach(t => { if(t.intervalId) clearInterval(t.intervalId); }); timers = [];
                events = [{ id: Date.now(), date: "2026-05-26", title: "System Refreshed Successfully" }];
                if(document.getElementById('globalNotes')) document.getElementById('globalNotes').value = "";
                fullRender();
            }
        }

        function exportAllData() {
            const dataDump = { tasks, columnNames, reminders, events, notes: document.getElementById('globalNotes').value };
            const blob = new Blob([JSON.stringify(dataDump, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'idev_architect_backup.json'; a.click();
        }

        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m])); }
        function updateDateTime() {
            const d = new Date(2026, 4, 26);
            if(document.getElementById('currentDateBadge')) document.getElementById('currentDateBadge').innerText = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
            if(document.getElementById('liveTimeBadge')) document.getElementById('liveTimeBadge').innerText = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        
        setInterval(updateDateTime, 1000); updateDateTime();
        
        // Initial Startup Engine Run
        loadAllLocalCacheFallback();
        fullRender(false); 
        initAuthObserver();
    </script>
</body>
</html>
